<div class="form-kutusu">
  <h2>Kayıt Ol</h2>

  <form (ngSubmit)="kayitOl()">
    <label>
      Ad
      <input type="text" name="ad" [(ngModel)]="ad" required />
    </label>

    <label>
      Soyad
      <input type="text" name="soyad" [(ngModel)]="soyad" required />
    </label>

    <label>
      TC Kimlik No
      <input type="text" name="tcKimlik" [(ngModel)]="tcKimlik" maxlength="11" required />
    </label>

    <label>
      Telefon No
      <input
        type="tel"
        name="telNo"
        [(ngModel)]="telNo"
        placeholder="05XX XXX XX XX"
        maxlength="11"
        required
      />
    </label>

    <label>
      E-posta
      <input type="email" name="eposta" [(ngModel)]="eposta" required />
    </label>

    <label>
      Şifre
      <input type="password" name="sifre" [(ngModel)]="sifre" required />
    </label>

    @if (hataMesaji()) {
      <p class="hata">{{ hataMesaji() }}</p>
    }

    <button type="submit" [disabled]="gonderiliyor()">
      {{ gonderiliyor() ? 'Kayıt oluşturuluyor...' : 'Kayıt Ol' }}
    </button>
  </form>

  <p>Zaten hesabın var mı? <a routerLink="/login">Giriş yap</a></p>
</div>
