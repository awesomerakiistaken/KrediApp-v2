<div class="form-kutusu">
  <h2>Giriş Yap</h2>

  <form (ngSubmit)="girisYap()">
    <label>
      E-posta
      <input type="email" name="eposta" [(ngModel)]="eposta" required />
    </label>

    <label>
      Şifre
      <input type="password" name="sifre" [(ngModel)]="sifre" required />
    </label>

    @if (hataMesaji()) {
      <p class="hata">{{ hataMesaji() }}</p>
    }

    <button type="submit" [disabled]="gonderiliyor()">
      {{ gonderiliyor() ? 'Giriş yapılıyor...' : 'Giriş Yap' }}
    </button>
  </form>

  <p>Hesabın yok mu? <a routerLink="/kayit">Kayıt ol</a></p>
</div>
